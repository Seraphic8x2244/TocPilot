name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build/upload, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-x64-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Write SHA-256 sidecar
        shell: pwsh
        run: |
          $exe = "build/Release/TocPilot.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  TocPilot.exe" | Set-Content -NoNewline -Encoding ascii "build/Release/TocPilot.exe.sha256"

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" `
              "build/Release/TocPilot.exe" `
              "build/Release/TocPilot.exe.sha256" `
              --clobber
          } else {
            gh release create "$env:RELEASE_TAG" `
              "build/Release/TocPilot.exe" `
              "build/Release/TocPilot.exe.sha256" `
              --title "$env:RELEASE_TAG" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
