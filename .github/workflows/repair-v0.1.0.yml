name: Repair v0.1.0 Release Assets

on:
  push:
    branches:
      - "p0-self-update"

permissions:
  contents: write

jobs:
  repair-v0-1-0:
    runs-on: windows-latest

    steps:
      - name: Checkout exact v0.1.0 tag
        uses: actions/checkout@v4
        with:
          ref: v0.1.0

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Write SHA-256 sidecar
        shell: pwsh
        run: |
          $exe = "build/Release/TocPilot.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  TocPilot.exe" | Set-Content -NoNewline -Encoding ascii "build/Release/TocPilot.exe.sha256"

      - name: Upload assets to existing v0.1.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v0.1.0" `
            "build/Release/TocPilot.exe" `
            "build/Release/TocPilot.exe.sha256" `
            --clobber
